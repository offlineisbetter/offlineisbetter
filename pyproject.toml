[project]
name = "offlineisbetter"
version = "0.1.0"
description = "Offline is better."
readme = "README.md"
authors = [
    { name = "offlineisbetter", email = "dev@offlineisbetter.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "requests>=2.34.2",
    "tokenizers>=0.23.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
offlineisbetter = "offlineisbetter:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
